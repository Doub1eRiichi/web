<style>
:root{

*{box-sizing:border-box}

[hidden]{display:none!important}

.wrap{max-width:960px;margin:0 auto;padding:32px 16px 64px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px}
.name-row{display:flex;align-items:center}
#player{appearance:none;background:transparent;border:1px solid transparent;border-radius:8px;
  padding:2px 34px 2px 8px;margin-left:-8px;
  font:inherit;font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--ink);
  cursor:pointer;max-width:100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;background-size:20px}
#player:hover{border-color:var(--border);background-color:var(--card)}
#player:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.uid{margin:4px 0 0;font-size:14px;color:var(--faint)}
.hero{display:flex;gap:16px}
.hero>div{text-align:center}
.num{font-size:24px;font-weight:700;color:#374151;line-height:1.2}
.num.indigo{color:var(--indigo)}
.cap{font-size:12px;color:var(--dim);margin-top:2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.tab{appearance:none;background:none;border:none;border-bottom:2px solid transparent;
  padding:8px 14px;margin-bottom:-1px;font:inherit;font-size:14px;font-weight:500;
  color:var(--dim);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--indigo);border-bottom-color:var(--indigo)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.dist{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .dist{grid-template-columns:repeat(3,1fr)}
}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;
  display:flex;flex-direction:column;gap:4px}
.label{font-size:12px;font-weight:500;color:var(--dim)}
.value{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.dist-title{margin:0 0 12px;font-size:12px;font-weight:600;color:var(--dim)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar-head span:first-child{color:#374151}
.bar-val{font-weight:500;font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--track);border-radius:9999px;overflow:hidden}
.fill{height:100%;background:var(--bar);border-radius:9999px}
.foot{border-top:1px solid var(--border);padding-top:16px;font-size:13px;color:var(--dim)}
.foot p{margin:0 0 8px}
.foot ul{margin:8px 0 0;padding-left:18px}
summary{cursor:pointer}
code{font:12px/1.5 Consolas,monospace;background:var(--border);padding:1px 5px;border-radius:3px}
@media(prefers-color-scheme:dark){
  :root{--bg:#111827;--card:#1f2937;--border:#374151;--ink:#f3f4f6;--dim:#9ca3af;
        --faint:#6b7280;--indigo:#818cf8;--bar:#818cf8;--track:#374151}
  .num{color:#e5e7eb}
  .bar-head span:first-child{color:#d1d5db}
  #player option{background:var(--card);color:var(--ink)}
}
</style>

  function formatValue(value, kind) {
    if (value === null || value === undefined || isNaN(value)) return '-';
    if (kind === 'int') return Math.round(value).toLocaleString('ko-KR');
    if (kind === 'percent') return (value * 100).toFixed(2) + '%';

  function formatPercent(value) {

  function el(tag, className, text) {

    });
    return wrap;
  }

  function render() {
    var player = DATA.players[Number(select.value)];
    var stats = player.stats;

    document.getElementById('uid').textContent = player.account_id;
    document.getElementById('games').textContent = stats.games;
    document.getElementById('kyokus').textContent = stats.kyokus;
    document.getElementById('rank').textContent =
      stats.avg_rank === null || stats.avg_rank === undefined ? '-' : stats.avg_rank.toFixed(2);
    document.title = player.name + ' 스탯 ' + stats.games + '경기';

    panels.textContent = '';
    DATA.tabs.forEach(function (tab) {
      var panel;
      if (tab.key === 'distribution') {
        panel = distPanel(stats);
      } else {
        panel = el('div', 'grid');
        tab.metrics.forEach(function (metric) {
          panel.appendChild(metricCard(metric[0], stats[metric[1]], metric[2]));
        });
      }
      panel.id = 'panel-' + tab.key;
      panel.hidden = tab.key !== activeTab;
      panels.appendChild(panel);
    });
  }

  document.querySelectorAll('.tab').forEach(function (button) {
    button.addEventListener('click', function () {
      activeTab = button.dataset.tab;
      document.querySelectorAll('.tab').forEach(function (other) {
        other.classList.toggle('active', other === button);
      });
      document.querySelectorAll('#panels > *').forEach(function (panel) {
        panel.hidden = panel.id !== 'panel-' + activeTab;
      });
    });
  });

  select.addEventListener('change', render);
  render();
})();
</script>
</body></html>
